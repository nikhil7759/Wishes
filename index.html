<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- Primary SEO Metadata -->
    <title>Wishes by Om Sweets | Luxury Gifting, Artisanal Sweets &amp; Floral Couture</title>
    <meta name="description" content="Discover Wishes by Om Sweets - luxury artisanal confections, hand-crafted chocolates, floral services, and bespoke gift boxes for every special occasion." />
    <meta name="keywords" content="Wishes, Om Sweets, luxury gifting, artisanal chocolates, floral couture, gift boxes, gourmet sweets, luxury confections, corporate gifting" />
    <meta name="author" content="Wishes by Om Sweets" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://wishes.co.in" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wishes.co.in/" />
    <meta property="og:title" content="Wishes by Om Sweets | Luxury Gifting, Artisanal Sweets &amp; Floral Couture" />
    <meta property="og:description" content="Elevate your celebrations with hand-crafted chocolates, luxury floral designs, and artisanal gift boxes from Wishes by Om Sweets." />
    <meta property="og:image" content="/logo/wishes%20logo.png" />
    <meta property="og:site_name" content="Wishes by Om Sweets" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wishes by Om Sweets | Luxury Gifting &amp; Artisanal Sweets" />
    <meta name="twitter:description" content="Elevate your celebrations with hand-crafted chocolates, luxury floral designs, and artisanal gift boxes." />
    <meta name="twitter:image" content="/logo/wishes%20logo.png" />

    <!-- Performance: Font Preconnecting & Preloading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical local font files to prevent late font loading FOUT -->
    <link rel="preload" href="/font/Avus-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/font/National2Web-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/font/Burgues Script Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/font/Jost-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Google Fonts asynchronously loaded with display=swap -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" />

    <!-- JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Wishes by Om Sweets",
        "url": "https://wishes.co.in",
        "logo": "https://wishes.co.in/logo/wishes%20logo.png",
        "description": "Luxury artisanal confections, hand-crafted chocolates, floral services, and bespoke gift boxes by Om Sweets.",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
